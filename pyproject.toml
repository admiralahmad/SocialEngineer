[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "socialengineer"
version = "2.0.0-dev"
description = "Social engineering awareness and security simulation framework"
requires-python = ">=3.12"
authors = [
    {name = "Ahmad Tijjani Saidu"}
]
dependencies = [
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
socialengineer = "socialengineer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"